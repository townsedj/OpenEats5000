services:
  api:
    build: api/
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      env_dev.list
    volumes:
      - ./api:/code
      - static-files:/code/static-files
      - site-media:/code/site-media
    depends_on:
      - db
    ports:
      - "8000:8000"
  web:
    build: web/
    command: yarn dev
    env_file:
      env_dev.list
    volumes:
      - ./web:/code
    depends_on:
      - api
    ports:
      - "8080:8080"
  db:
    image: mariadb
    env_file:
      env_dev.list
    volumes:
      - database:/var/lib/mysql
    ports:
      - "3306:3306"
volumes:
  database:
  static-files:
  site-media:
